id: scanimation
name: Scanimation
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: barrier-grid
  background: "#000000"
  accent: "#ffc46b"

description: >
  A Scanimation toy. Big amber hour numerals are seen through a black barrier
  of slits, each window interleaving the current hour with the next. Over ten
  minutes centred just before the hour (half and half at :59:30), the striped
  sheet slides across and the numeral changes into the next. Between changes, live, the numeral dances, bending, swaying and
  squashing on the beat through a twelve-frame Scanimation loop, and the
  ring of minute ticks dances with it, kicking on the beat while two crests
  chase round the dial. The white minute
  hand is a rubber-hose Scanimation too: it sweeps round, bowing and
  wiggling on the beat, root and tip held fast.

designNotes: >
  Patrick's idea: a Scanimation sheet holding the times, shifted laterally
  under the mask to show the time. Refined with him: hours split into
  two-frame windows for legibility, slow changeovers centred just before the
  hour so both numerals are seen, and an analog minute hand that is itself a
  Scanimation. Amber hour ink, white minute ink, the mask plate black with
  amber hour indices.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py. Two-frame barrier: 3 px
  alternating columns, numeral k in column parity k % 2, and a 6 px-period
  rule sheet offset by 3 * (window + change) mod 6. The window clock lags the
  time by 270 s so the change is centred at :59:30. Twelve hour windows are
  separate SOURCE/MASK groups switched by group alpha. The minute hand is
  twelve chained frames in alternating rows under a rung sheet sliding along
  it, all in one group rotated to the minute with a black backing and a
  static cap. Live, twelve cropped dance windows per hour (frame p + frame
  p+1) chain under the same hour sheet, which slides 3 px a frame at six
  frames a second for the first 50 minutes of each window. The tick ring is
  twelve more chained windows under the white minute sheet on the same
  clock, never clamped.

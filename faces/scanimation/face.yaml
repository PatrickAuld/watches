id: scanimation
name: Scanimation
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: barrier-grid
  background: "#000000"
  accent: "#ffc46b"

description: >
  A Scanimation toy. One 12-hour sheet of fine rules slides slowly sideways
  under a black slit mask, 0.2 px a minute. Twelve hour numerals are
  interleaved in the centre and come through one at a time, overlapping
  their neighbour for a few minutes either side of each hour. The current
  minute's marking, one of sixty around the ring, lights up striped.

designNotes: >
  Patrick's idea: a single 12-hour Scanimation sheet holding the times,
  shifted slowly laterally under the mask to show the time. Amber hour ink,
  cool white minute ink, the mask plate black with faint printed indices.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py. The sheet is a 594 px
  wide image translated by one x-transform of minutes since twelve; it wraps
  seamlessly at 144 px. Hour rules tilted to a 144 px horizontal period move
  the interleaved numerals through one phase period in 12 hours. Minutes are
  faked: a marking-shaped mask window rotates by [MINUTE] * 6 over the sliding
  fine vertical minute rules. Each ink is a SOURCE/MASK group with the same
  sheet transform. Ambient keeps the mechanism at reduced alpha.

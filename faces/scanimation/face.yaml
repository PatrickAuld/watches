id: scanimation
name: Scanimation
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: barrier-grid
  background: "#000000"
  accent: "#ffc46b"

description: >
  A Scanimation toy. Big amber hour numerals are seen through a black barrier
  of slits, each window interleaving the current hour with the next. Over ten
  minutes centred just before the hour (half and half at :59:30), the striped
  sheet slides across and the numeral changes into the next. A white analog
  minute hand sweeps over sixty faint markings.

designNotes: >
  Patrick's idea: a Scanimation sheet holding the times, shifted laterally
  under the mask to show the time. Refined with him: hours split into
  two-frame windows for legibility, slow changeovers centred just before the
  hour so both numerals are seen, and a real analog minute hand. Amber hour
  ink, white minute hand, the mask plate black with faint printed indices.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py. Two-frame barrier: 3 px
  alternating columns, numeral k in column parity k % 2, and a 6 px-period
  rule sheet offset by 3 * (window + change) mod 6. The window clock lags the
  time by 270 s so the change is centred at :59:30. Twelve hour windows are
  separate SOURCE/MASK groups switched by group alpha. The minute hand is one
  rotated RGBA image.

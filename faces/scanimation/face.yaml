id: scanimation
name: Scanimation
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: barrier-grid
  background: "#000000"
  accent: "#ffc46b"

description: >
  A Scanimation toy. Big amber hour numerals and a lit minute marking are seen
  through a black barrier of slits. Each window interleaves the current value
  with the next one. Over the hour's last ten minutes, and each minute's last
  30 seconds, the striped sheet slides across and the numeral or marking
  changes into the next.

designNotes: >
  Patrick's idea: a Scanimation sheet holding the times, shifted laterally
  under the mask to show the time. Refined with him: minutes faked as
  per-minute markings, hours split into two-frame windows for legibility, and
  slow changeovers so the animation is visible. Amber hour ink, cool white
  minute ink, the mask plate black with faint printed indices.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py. Two-frame barrier: 3 px
  alternating columns, value k in column parity k % 2, and a 6 px-period rule
  sheet offset by 3 * (value + change) mod 6. Twelve hour windows are separate
  SOURCE/MASK groups switched by group alpha. The minute marking window is
  rotated to [MINUTE] and [MINUTE] + 1, each over the minute rules cut to that
  minute's column parity. Ambient dims only the minute ink.

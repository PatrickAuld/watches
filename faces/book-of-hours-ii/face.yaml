id: book-of-hours-ii
name: Book of Hours II
status: promoted
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: illuminated-manuscript
  background: "#0b0818"
  accent: "#f2c75c"

description: >
  Book of Hours with a camera. The 24-hour dial never changes: a quarter
  degree per minute, midnight at the bottom. Inside a chapter the camera
  swoops in, rolling the chapter to the top and magnifying the dial until
  that stretch of the band spans the glass. Minute graduations, quarter-hour
  labels and big numerals appear as they come close. Commutes pull back to
  the whole day.

designNotes: >
  Same illumination as Book of Hours (enamel chapters, gilt fillets, Cinzel
  lettering, faceted jewel) but the lettering is fixed glass over a moving
  world. Fine detail is engraved into the dial at sizes only legible when
  magnified. Chapter emblems ring the medallion when zoomed out.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py. The dial is static
  vector geometry (graduations are dashed arcs) inside one camera Group
  whose x, y, angle and scaleX/Y are closed-form in the chapter zooms.
  Zoomable bitmaps are 4x resolution. The jewel is counter-scaled.
  test_camera.py checks the camera every minute, including that the dial
  always fills the glass.

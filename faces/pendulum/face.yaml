id: pendulum
name: Pendulum
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: industrial-minimal
  background: "#000000"
  accent: "#ff3b2f"

description: >
  A linear sweep across the hour. A vertical line travels left to right at a
  constant rate: :00 at the left edge, :30 at the centre, :00 again at the
  right edge. A shaded window runs from the line to the next :00 or :30 and
  closes as the meeting approaches. A bar on the bezel shows the hour.

designNotes: >
  No numbers and no digital readout. One direction of travel, so every
  minute of the hour has its own position (:02 and :32 differ). Ticks ahead
  of the line inside the current half hour are lit; the line, bead and
  window turn red for the last five minutes. Bone on black, red reserved
  for meeting marks and the final minutes.

implementationNotes: >
  Generated by generate_xml.py. Sweep x = 45 + MINUTE_SECOND * 6. The window
  is a Rectangle with x and width transforms (width = minutes left * 6),
  inside a Group hidden in ambient. The name Pendulum is historical.

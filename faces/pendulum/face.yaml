id: pendulum
name: Pendulum
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: industrial-minimal
  background: "#000000"
  accent: "#ff3b2f"

description: >
  A seconds pendulum that runs down to the next meeting. The swing equals
  the minutes left until :00 or :30, at two degrees per minute against a
  minute scale. Two red gates mark the open window and close on the centre
  mark; at the half hour the pendulum hangs plumb, then the window snaps
  back open. A bar on the bezel shows the hour.

designNotes: >
  No numbers and no digital readout. The swing (and the gates) is minutes
  left; ticks outside the window go dark; the bob turns red for the last
  five minutes while the plumb line brightens. Bone on black with red
  reserved for the window and the meeting mark.

implementationNotes: >
  Generated by generate_xml.py. Swing = remaining * 2 * cos(pi * phase), with
  a 2 s period from SECONDS_SINCE_EPOCH and MILLISECOND (one beat per second,
  extremes on the tick). Gates and pendulum are Groups rotated about the dial
  centre; the window arc uses startAngle/endAngle transforms. Ambient hides the
  swing and shows the pendulum at rest.

id: penrose-gear-train
name: Penrose Gear Train
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: skeleton-movement
  background: "#07090D"
  accent: "#FF4A2E"

description: >
  A closed loop of 33 brass and steel gears riding a Penrose tribar. The
  hour, minute and second arbors sit on its three corners, each with a small
  chapter ring and hand. Every mesh is a real tooth count at the right centre
  distance, and every arbor turns at exactly the rate its neighbours force on
  it: up the right beam ×720, along the bottom ÷60, up the left ÷12, and the
  loop agrees with itself. The geometry is the impossible part.

designNotes: >
  Regulator layout: hours top, minutes bottom left, seconds bottom right, read
  from bone hands on fixed tick rings (red for seconds). At the top corner the
  left beam's gears pass behind the corner block and the right beam's pass in
  front, as the tribar itself does; the hour arbor runs through the block.
  Only the seconds end of the train visibly moves. Ambient is the tribar in
  outline with the hour and minute hands.

implementationNotes: >
  Generated by generate_xml.py, which derives arbor rates from tooth counts,
  places arbors at exact pitch-circle distances, and phases each gear image so
  its teeth fall in its neighbour's gaps. All angles come from local time in
  the 12-hour cycle as an integer plus milliseconds, modulo each arbor's
  period (every period divides 43200 s). Only arbors with periods of 240 s or
  less read MILLISECOND. test_train.py evaluates the XML expressions and checks
  ratios, centre distances, mesh phase and hand readings.

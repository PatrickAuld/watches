id: crosshatch
name: Crosshatch
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: scratchboard-engraving
  background: "#000000"
  accent: "#EDE4D3"

description: >
  A scratchboard engraving built around the half hour, for knowing at a
  glance whether a meeting is about to start. The crosshatched wedge runs from
  the minute line to the next :00 or :30 and narrows to nothing as it nears.
  Over the last five minutes the board warms to an accent colour and pulses
  faster; at :00 and :30 it flashes fully crosshatched and fades over two
  minutes. A lance cut from the board marks the hour. Five inks.

designNotes: >
  Patrick's goal: give :00 and :30 energy so an upcoming meeting is obvious.
  Every mark is an engraved line. Remaining time is the area of crosshatch
  left; urgency is colour and pulse rate; the moment itself is a flash. 12
  and 6 are enlarged gates, and the gate being approached glows. Ambient
  keeps the lance, the hairline, a rim countdown arc that turns to the
  accent colour in the last five minutes, and dimmed indices.

implementationNotes: >
  Resource-only WFF v4 written by generate_xml.py, which also renders the
  tintable PNG assets. The countdown wedge and rim arc are Arcs from the
  minute angle to 180 or 360 (MASK group for the wedge). Warm-up, run-up,
  gate glow and flash are accent-tinted layers whose alpha is driven by
  clamp/pow/sin expressions on the minutes left in the half hour; each sits
  in a parent Group carrying the ambient Variant so the alpha Transform
  cannot override it. The nib follows seconds plus milliseconds.

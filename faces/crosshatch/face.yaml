id: crosshatch
name: Crosshatch
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: scratchboard-engraving
  background: "#000000"
  accent: "#EDE4D3"

description: >
  A scratchboard engraving that shades itself in. The board is ruled in fine
  single hatching; a perpendicular hatch follows the minute line round from 12,
  so the passed part of the hour is crosshatched. Even hours shade in, odd
  hours scrape back out. A lance cut from the board marks the hour, and a
  glowing nib runs out along the minute line once a minute. Five inks.

designNotes: >
  Every mark is an engraved line: no fills, no numerals. Tone comes from line
  density and weight, so the crosshatched sector reads brighter than the
  single-hatched ground. The hour lance is a black reserve shaded with
  swelling strokes along its axis; the minute is a carved hairline. Ambient
  keeps only the lance, the hairline and dimmed indices.

implementationNotes: >
  Resource-only WFF v4 written by generate_xml.py, which also renders the
  tintable PNG assets (analytic per-pixel hatching at 3x with hand wobble and
  ragged rim ends). The sector is a SOURCE hatch image under a MASK Arc whose
  startAngle/endAngle Transforms follow the minute, switching between fill and
  scrape on hour parity. Hour and minute are rotating Groups; the nib is a
  small tinted glow whose y follows seconds plus milliseconds.

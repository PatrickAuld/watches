id: radar
name: Radar
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: phosphor-scope
  background: "#020b05"
  accent: "#3dff6e"

description: >
  A plan-position radar scope. The hands exist only as echoes: a sweep arm
  circles every four seconds, and the hour, minute and second blips flash
  where the arm finds them, then fade into the phosphor. Five scope colors.

designNotes: >
  Hands are dotted radar returns, not drawn hands. One echo per hand, drawn
  where the arm found it. No text, complications or case.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py. Sweep angle comes from
  epoch seconds plus milliseconds; each echo's painted position and alpha are
  closed-form functions of the sweep-to-hand gap. Two tintable PNG assets
  (sweep afterglow, scope glow). Theme is a ColorConfiguration. Ambient shows
  static dotted hour and minute hands on black.

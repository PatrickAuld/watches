id: radar
name: Radar
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: phosphor-scope
  background: "#020b05"
  accent: "#3dff6e"

description: >
  A plan-position radar scope. A sweep arm turns smoothly every four seconds;
  the hour, minute and second hands are dotted radar returns that ping white
  the instant the line crosses them, then dim into the phosphor. Five scope colors.

designNotes: >
  Hands are dotted radar returns at their true positions, invisible except
  where the sweep reveals them. No text, complications or case.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py. The sweep angle uses
  epoch seconds plus milliseconds. Two copies of the hands sit under
  SOURCE/MASK groups whose PNG masks rotate with the arm: a long afterglow
  mask and a narrow ping mask. Theme is a ColorConfiguration. Ambient shows
  static dotted hour and minute hands on black.

id: interfence-morph
name: Interfence-Morph
status: promoted
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: kinetic-interference
  background: "#0b0a1f"
  accent: "#26c2d9"

description: >
  After the Humism kinetic dials: two discs carry the same bold 6-fold pattern,
  a minute wheel below and a seconds wheel turning over it, so interference
  sweeps the dial continuously and the discs snap into register every ten
  seconds. The pattern is a nest of polygons whose sides bend over the day,
  from concave stars to hard straight lines to scalloped petals, while it
  twists and staggers, in the manner of Brian Eno's ambient paintings. The
  bending is too slow to watch, but the face is different a few minutes later.
  Six luminous palettes; time is read from beads on the rim.

designNotes: >
  Hour bead (large) and minute bead ride a dark rim track; a small seconds
  bead rides the seconds wheel. The upper disc is composited with LIGHTEN so
  where the bands cross they glow in a third colour. Two soft colour fields
  drift behind the pattern. No numerals or hands.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py. Each disc is 13 rings of
  six Arc sides in static sector groups; arc centre, radius and sweep are
  expressions of a curvature driven by the minute of the day (periods divide
  1440, so midnight is seamless). Concave sides are mirrored by a scaleY sign
  group. Ring groups carry twist and stagger. Disc rotation uses
  SECOND/MILLISECOND and MINUTE/SECOND. Palette is a ColorConfiguration of
  five colours. Ambient shows outlined hour and minute beads and the twelve
  rim dots on black.

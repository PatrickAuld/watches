id: interfence-morph
name: Interfence-Morph
status: promoted
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: kinetic-interference
  background: "#0b0a1f"
  accent: "#26c2d9"

description: >
  After the Humism kinetic dials: two discs carry the same bold ring pattern,
  a minute wheel below and a seconds wheel turning over it, so interference
  fringes sweep the dial every second and the patterns snap into register
  once a minute. The pattern itself slowly morphs all day, its eccentricity,
  curl, stretch and pitch drifting on unequal loops in the manner of Brian
  Eno's ambient paintings, too slowly to watch but a different face a few
  minutes later. Six luminous palettes; time is read from beads on the rim.

designNotes: >
  Hour bead (large) and minute bead ride a dark rim track; a small seconds
  bead rides the seconds wheel. The upper disc is composited with SCREEN so
  where the bands cross the light adds into a third colour. Two soft colour
  fields drift behind the pattern. No numerals or hands.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py. Each disc is one PartDraw
  of 24 stroked ellipses whose centres, aspect and scale are expressions of the
  minute of the day (periods divide 1440, so midnight is seamless). Disc
  rotation uses SECOND/MILLISECOND and MINUTE/SECOND. Palette is a
  ColorConfiguration of five colours. Ambient shows outlined hour and minute
  beads and the twelve rim dots on black.

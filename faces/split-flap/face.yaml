id: split-flap
name: SplitFlap
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: mechanical-digital
  background: "#111111"
  accent: "#f3efe6"

description: >
  The whole dial is a board of small split-flap cells. Hours over minutes
  are spelled in a 5 x 7 cell font in ivory flaps; every other cell is a
  quiet dark flap. When the minute turns, the changed cells flip, each top
  flap falling and the new bottom flap landing, in a ripple from the top
  left.

designNotes: >
  Station-board mechanics, no other marks. 12-hour, leading zero blank.
  Ambient keeps only the settled ivory cells, dimmed, on black.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py. Background cells are
  one PNG. Each digit cell's state is a bit lookup, floor(mask / pow(2,
  digit)) % 2. The previous minute's digits come from the current time, so
  the flip needs no state. Flaps are Groups with scaleY transforms about
  the hinge. A lit face is hidden by transforming a RoundRectangle's height
  to zero.

id: radial-moire
name: Radial Moiré
status: promoted
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: optical-engraving
  background: "#fcfaf5"
  accent: "#27221d"

description: >
  Three selectable kinetic plate geometries: an eccentric rotating vertical
  slit disc over a fixed ruled substrate, opening petals, and folding facets.
  Their shapes emerge from interference between registered transparent plates.
  Four paper-and-ink palettes are independently selectable in the editor.
  Ambient shows only the hour and minute hands on black.

implementationNotes: >
  The face is editable, with three placement flavors and independent Plate
  geometry and Dial palette settings in the editor and web preview. The vertical
  option moves only its off-center slit disc over stationary vertical rules.
  The petal and facet options cross radial engravings with a second slow disc,
  changing their apparent forms over minutes. Each moving plate rotates smoothly
  using epoch seconds plus milliseconds, and its mask reveals the matching
  stationary engraving inside both clock hands. Ambient hides all dial plates
  and leaves static textured hands following the time. Generate assets with
  generate_assets.py; strings.xml supplies watch editor option labels.

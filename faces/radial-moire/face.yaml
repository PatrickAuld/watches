id: radial-moire
name: Radial Moiré
status: promoted
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: optical-engraving
  background: "#fcfaf5"
  accent: "#27221d"

description: >
  Three selectable moiré mechanisms, each a fine fixed grating under one
  slowly turning transparent grating with a near-matching frequency, so coarse
  interference fringes race around the dial far faster than the plates move:
  a three-armed beat pinwheel, petals that bloom and fold, and arcs streaming
  between twin poles. Four paper-and-ink palettes are independently
  selectable in the editor. Ambient shows only outline hands on black.

implementationNotes: >
  The face is editable, with three placement flavors and independent Plate
  geometry and Dial palette settings in the editor and web preview. Every
  plate is a full-opacity 50% duty grating at 5 px pitch inside an annular
  window; only the top plate rotates (2 or 3 degrees per second, wrapped at a
  symmetry period with epoch seconds plus milliseconds). Hands are clear paper
  silhouettes with inked edges drawn above the moiré. Ambient hides paper,
  plates and dial furniture. Generate assets with generate_assets.py;
  strings.xml supplies watch editor option labels.

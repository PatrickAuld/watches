id: radial-moire
name: Radial Moiré
status: promoted
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: optical-engraving
  background: "#fcfaf5"
  accent: "#27221d"

description: >
  Analog hour and minute pointers emerge through the registered intersection
  of curved radial ink lines and a continuously rotating slit plate. A second
  plate drifts much more slowly, changing the interference over several minutes.
  On wake the dial is white; in ambient only the hands remain on black.

implementationNotes: >
  The two hand engravings and the transparent slit plate share a curved
  80-fold radial grating. WFF rotates the plate 1.125 degrees per second using
  SECOND_MILLISECOND, yielding a seamless four-second optical cycle. The hour
  and minute substrates follow time independently; their masks register to
  the same global plate. A second curved plate rotates 0.45 degrees per minute
  using MINUTES_SINCE_EPOCH and SECOND_MILLISECOND and multiplies into both
  hand masks. Ambient hides all moving plates and uses static light-on-black
  engraved hands that follow HOUR_0_23 and MINUTE. Regenerate assets with
  generate_assets.py.

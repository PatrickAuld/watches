id: radial-moire
name: Radial Moiré
status: promoted
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: optical-engraving
  background: "#050607"
  accent: "#f9eac7"

description: >
  Analog hour and minute pointers emerge through the registered intersection
  of curved radial ink lines and a continuously rotating slit plate. The
  interference flows through both pointers as they follow the real time.

implementationNotes: >
  The two hand engravings and the transparent slit plate share a curved
  80-fold radial grating. WFF rotates the plate 1.125 degrees per second using
  SECOND_MILLISECOND, yielding a seamless four-second optical cycle. The hour
  and minute substrates follow time independently; their masks register to
  the same global plate. Regenerate assets with generate_assets.py.

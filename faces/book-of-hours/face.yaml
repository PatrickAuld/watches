id: book-of-hours
name: Book of Hours
status: promoted
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: illuminated-manuscript
  background: "#0b0818"
  accent: "#f2c75c"

description: >
  Patrick's day as an illuminated 24-hour dial. Sleep, Family, Work, Family
  and Evening are enamel chapters on a gilt band. Inside a chapter the dial
  zooms in, turning the chapter to the top and opening it across 270
  degrees, with the hours lit behind a jewel and a countdown. While
  commuting it zooms out to the whole day and gilds the road home.

designNotes: >
  Book-of-Hours lettering (Cinzel Decorative with a pigment drop cap), a
  faceted emblem per chapter, engine-turned rosettes that counter-rotate,
  beaded gilt bezel, damask field. The rest of the day folds into the
  bottom quarter while zoomed. No complications.

implementationNotes: >
  Resource-only WFF v4 generated by generate_xml.py and generate_assets.py
  from a SCHEDULE table. Every mark's angle is its overview angle plus a
  per-chapter constant times that chapter's zoom (a trapezoid of minutes
  since the chapter began), so the zoom is closed form. Arcs transform
  startAngle/endAngle. Lettering and digits are PNGs selected with Group
  alpha transforms. test_schedule.py evaluates the XML for every minute.

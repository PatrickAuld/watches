id: sundial-ii
name: Sundial II
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 20

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: solar-geometric
  background: "#f2efe5"
  accent: "#c87a47"

description: >
  A floating chord joins an inner hour bead to an outer minute ring.
  Choose a floating line or raised wall shadow, following the Sun above
  Alameda, California. A softly concave rim recesses the ivory dial, which
  fades through twilight to quiet blue at night.

designNotes: >
  No case, metallic bevels, conventional hands, center hub, or complications.
  Unequal endpoint radii preserve readability when hour and minute coincide.

implementationNotes: >
  Resource-only WFF v4. USNO solar coordinates from UTC timestamp, projected
  into the fixed Alameda east/north/up frame. An editable Shadow geometry
  setting selects Floating line or Raised wall. Solar rim shading creates
  a recessed dial. Shadows fade at the horizon
  and vanish at night; grazing lengths are capped. North is dial-up, not
  compass-aligned. Black ambient mode preserves only time and cardinal ticks.

location:
  latitude: 37.7652
  longitude: -122.2416
  name: Alameda, California

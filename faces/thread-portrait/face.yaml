id: thread-portrait
name: Thread Portrait
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: string-art
  background: "#0b0a09"
  accent: "#f3ebdc"

description: >
  A pin-and-string portrait of the time. 340 ivory threads are stretched
  pin to pin across a dark board, and where they bunch and cross they draw
  the hour over the minutes. When a digit changes its threads wind up,
  snap round the rim to their new pins, overshoot and wobble into place like
  a cartoon, landing exactly as the minute turns. Nine spools pair board,
  pin and thread colours with a thread weight, from Ivory Silk to Red
  String Theory and Neon Noodle.

designNotes: >
  Constant thread count; every thread is a true chord of the pin circle.
  Threads catch the light inside the current digits and stay dim elsewhere,
  so the numerals read at a glance while the whole web stays visible.
  Direction leads and length follows, so threads swing first and then
  stretch or squash. 12-hour, no leading zero. No complications.

implementationNotes: >
  Resource-only WFF v4 generated by solve.py (greedy string-art per digit
  value, Hungarian assignment of chords to threads between consecutive
  values) and generate_xml.py. Each thread is a rotor Group (direction m)
  holding a thin PartDraw shifted by offset d; m and d are ternary lookups
  on the slot value plus an eased step to the next value in the last ~2 s
  before it changes, so ambient always sees settled threads. Threads sit
  under a MASK of a dim disc plus cross-faded glyph glows.
  A Spool ColorConfiguration colours the board, pins and three stroke
  weights per thread (transparent strokes select the weight).

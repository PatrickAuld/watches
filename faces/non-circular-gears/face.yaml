id: non-circular-gears
name: Non-Circular Gears
status: draft
platformTarget: pixel-watch

display:
  shape: round
  baseResolution: 450
  safeInset: 24

wff:
  version: 4
  xmlOnly: true

features:
  ambient: true
  complications: []

style:
  family: horological-skeleton
  background: "#1e2126"
  accent: "#cda55c"

description: >
  Two identical elliptical brass gears turn in a window in the dial. The
  lower one turns steadily, once a minute; the upper one sits on the hand
  arbor and carries the second hand. Because they are pivoted at a focus,
  the hands race through the top of the dial at more than twice their
  average speed and crawl through the bottom at less than half. The minute
  scale is spaced by the same law, wide at 12 and crowded at 6, so the
  minute and second hands land on their marks exactly.

designNotes: >
  The follower gear's long side always points along the second hand, so
  the gear visibly leans into the fast part of the dial. The minute hand
  follows the same law once an hour; the hour hand is uniform against its
  own brass batons. The scale is subdivided into quarter and half minutes
  only where it is stretched enough to hold them, which draws the law onto
  the dial. Ambient keeps the stretched scale, numerals and the hour and
  minute hands on black.

implementationNotes: >
  Resource-only WFF v4 generated by generate_assets.py and generate_xml.py
  from geometry.py. For a uniform driver angle u the follower angle is
  u + 2 atan(e sin u / (1 - e cos u)), e = 0.4, written in the XML with
  atan, sin, cos, deg and rad. Both gears are one PNG (27 teeth, a tooth at
  periapsis) rotated in Groups pivoted at their foci, 96 units apart.
  test_gears.py checks contact, pure rolling, the speed extremes, that the
  scale marks sit where the hands read, and the XML expression.

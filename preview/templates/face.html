<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>${name} — Watch Faces</title>
    <meta name="description" content="${description}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="${name}" />
    <meta property="og:description" content="${description}" />
    <meta property="og:url" content="${url}" />
${og_image}
    <link rel="canonical" href="${url}" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body data-root="../../" data-face="${slug}">
    <main class="shell">
      <nav class="topbar">
        <a href="../../">&larr; All faces</a>
        <span class="pager">${pager}</span>
      </nav>

      <div class="layout">
        <section class="stage">
          <div class="watch-frame">
            <div class="watch-screen">
              <canvas id="watch-canvas" width="450" height="450" aria-label="${name} preview"></canvas>
              <div id="placeholder" class="placeholder" hidden></div>
            </div>
          </div>
          <p class="readout" id="readout" hidden>
            <span id="clock"></span>
            <span class="pill" id="clock-mode">Live</span>
          </p>
        </section>

        <aside class="panel">
          <header>
            <h1>${name} <span class="badge status-${status}">${status}</span></h1>
            <p class="lede">${description}</p>
          </header>

          <div id="controls" hidden>
            <div class="group">
              <h2>Time</h2>
              <div class="chips" id="time-chips">
                <button type="button" data-time="now" class="active">Now</button>
                <button type="button" data-time="10:10">10:10</button>
                <button type="button" data-time="03:30">3:30</button>
                <button type="button" data-time="08:59">8:59</button>
                <button type="button" data-time="23:59">23:59</button>
                <input type="time" id="time-input" aria-label="Custom start time" />
              </div>
            </div>

            <div class="group" id="style-group" hidden>
              <h2 id="style-label">Style</h2>
              <div class="chips" id="style-chips"></div>
            </div>

            <div class="group" id="palette-group" hidden>
              <h2>Color</h2>
              <div class="chips" id="palette-chips"></div>
            </div>

            <div class="group">
              <label class="switch">
                <input type="checkbox" id="ambient-toggle" />
                <span class="track" aria-hidden="true"></span>
                <span>Ambient mode</span>
              </label>
            </div>
          </div>

          <details class="details">
            <summary>face.yaml</summary>
            <pre class="yaml" id="meta-panel">Loading&hellip;</pre>
          </details>
        </aside>
      </div>

      <footer>
        Rendered from canonical watchface.xml via wff-web &middot; <a href="../../privacy.html">Privacy policy</a>
      </footer>
    </main>

    <script type="module" src="../../preview.js"></script>
  </body>
</html>

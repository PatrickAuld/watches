<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>${name} — Watch Faces</title>
    <meta name="description" content="${description}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="${name}" />
    <meta property="og:description" content="${description}" />
    <meta property="og:url" content="${url}" />
${og_image}
    <link rel="canonical" href="${url}" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body data-root="../../" data-face="${slug}">
    <main class="shell">
      <nav class="crumbs"><a href="../../">&larr; All watch faces</a></nav>
      <header>
        <h1>${name} <span class="badge status-${status}">${status}</span></h1>
        <p class="lede">${description}</p>
      </header>

      <div class="layout">
        <div>
          <div class="watch-frame">
            <div class="watch-screen">
              <canvas id="watch-canvas" width="450" height="450"></canvas>
              <div id="placeholder" class="placeholder" style="display:none"></div>
            </div>
          </div>
        </div>

        <div class="sidebar">
          <div class="card controls">
            <h3>Face</h3>
            <label>
              <span>Watch face</span>
              <select id="face-picker"></select>
            </label>
          </div>

          <div class="card controls" id="style-card" hidden>
            <h3>Theme</h3>
            <label><span>Plate geometry</span><select id="style-picker"></select></label>
          </div>

          <div class="card controls" id="palette-card" hidden>
            <h3>Color</h3>
            <label><span>Dial palette</span><select id="palette-picker"></select></label>
          </div>

          <div class="card controls" id="time-card">
            <h3>Time</h3>
            <label>
              <span>Mode</span>
              <select id="time-mode">
                <option value="fixed">Fixed</option>
                <option value="live">Live</option>
              </select>
            </label>
            <label>
              <span>Time</span>
              <input type="datetime-local" id="time-input" />
            </label>
            <div class="button-row">
              <button data-set-time="10:10">10:10</button>
              <button data-set-time="12:00">12:00</button>
              <button data-set-time="15:30">3:30</button>
              <button data-set-time="21:45">9:45</button>
              <button data-set-time="00:00">00:00</button>
            </div>
          </div>

          <div class="card controls" id="display-card">
            <h3>Display</h3>
            <label class="check">
              <input type="checkbox" id="ambient-toggle" />
              <span>Ambient mode</span>
            </label>
            <label class="check">
              <input type="checkbox" id="animate-toggle" />
              <span>Animate (live rendering)</span>
            </label>
          </div>

          <div class="card meta">
            <h3>Metadata</h3>
            <div id="meta-panel"><p class="muted">Loading&hellip;</p></div>
          </div>
        </div>
      </div>

      <footer>
        Rendered from canonical watchface.xml via wff-web &middot; <a href="../../privacy.html">Privacy policy</a>
      </footer>
    </main>

    <script type="module" src="../../preview.js"></script>
  </body>
</html>

name: Prepare Android package ownership proof

on:
  workflow_dispatch:
    inputs:
      registration_snippet:
        description: Paste the exact snippet shown by Play Console
        required: true
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      WATCHES_KEYSTORE_B64: ${{ secrets.WATCHES_KEYSTORE_B64 }}
      WATCHES_KEYSTORE_PASSWORD: ${{ secrets.WATCHES_KEYSTORE_PASSWORD }}
      WATCHES_KEY_ALIAS: ${{ secrets.WATCHES_KEY_ALIAS }}
      WATCHES_KEY_PASSWORD: ${{ secrets.WATCHES_KEY_PASSWORD }}
      REGISTRATION_SNIPPET: ${{ inputs.registration_snippet }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure existing app signing key
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$WATCHES_KEYSTORE_B64" && -n "$WATCHES_KEYSTORE_PASSWORD" && -n "$WATCHES_KEY_ALIAS" && -n "$WATCHES_KEY_PASSWORD" ]] || {
            echo "Configure the existing WATCHES_* signing secrets before generating a proof APK." >&2
            exit 1
          }
          key="$RUNNER_TEMP/watches.jks"
          printf '%s' "$WATCHES_KEYSTORE_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "WATCHES_KEYSTORE=$key" >> "$GITHUB_ENV"
      - name: Add Play Console verification snippet
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          target = Path("apps/phone/src/main/assets/adi-registration.properties")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(os.environ["REGISTRATION_SNIPPET"].rstrip() + "\n", encoding="utf-8")
          PY
      - name: Build APK signed with the existing app key
        run: ./gradlew --no-daemon :apps:phone:assemblePlayVerification
      - uses: actions/upload-artifact@v4
        with:
          name: android-package-ownership-proof
          path: apps/phone/build/outputs/apk/playVerification/*.apk
          if-no-files-found: error
          retention-days: 7

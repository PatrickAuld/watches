name: Build and publish watch faces

on:
  push:
    branches: [main]
    paths:
      - 'faces/**'
      - 'apps/**'
      - 'watchface/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - '.github/workflows/build-wear.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WATCHES_KEYSTORE_B64: ${{ secrets.WATCHES_KEYSTORE_B64 }}
      WATCHES_KEYSTORE_PASSWORD: ${{ secrets.WATCHES_KEYSTORE_PASSWORD }}
      WATCHES_KEY_ALIAS: ${{ secrets.WATCHES_KEY_ALIAS }}
      WATCHES_KEY_PASSWORD: ${{ secrets.WATCHES_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate canonical XML and preview
        run: python3 scripts/build-site.py --check
      - name: Configure stable signing
        if: env.WATCHES_KEYSTORE_B64 != ''
        run: |
          echo "$WATCHES_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/watches.jks"
          echo "WATCHES_KEYSTORE=$RUNNER_TEMP/watches.jks" >> "$GITHUB_ENV"
      - name: Determine publication
        id: publication
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" && -n "$WATCHES_KEYSTORE_B64" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build paired apps
        run: ./gradlew :apps:phone:assembleDebug :apps:watch:assembleDebug
      - name: Download official Watch Face Push validator
        run: |
          curl --fail --location --retry 3 \
            https://dl.google.com/dl/android/maven2/com/google/android/wearable/watchface/validator/validator-push-cli/1.1.0-alpha01/validator-push-cli-1.1.0-alpha01.jar \
            --output "$RUNNER_TEMP/validator-push-cli.jar"
      - name: Validate promoted face builds
        run: |
          for slug in $(python3 -c 'import pathlib,re; print(" ".join(p.parent.name for p in pathlib.Path("faces").glob("*/watchface.xml") if re.search(r"^status: promoted$", (p.parent/"face.yaml").read_text(), re.M)))'); do
            ./gradlew :watchface:assembleDebug -PfaceSlug="$slug"
            java -jar "$RUNNER_TEMP/validator-push-cli.jar" \
              --apk_path=watchface/build/outputs/apk/debug/watchface-debug.apk \
              --package_name=com.patrickauld.watches.companion
          done
      - name: Package signed validated release
        if: github.event_name != 'pull_request' && env.WATCHES_KEYSTORE_B64 != ''
        run: python3 scripts/build-release.py --validator "$RUNNER_TEMP/validator-push-cli.jar"
      - name: Include companion builds in release
        if: github.event_name != 'pull_request' && env.WATCHES_KEYSTORE_B64 != ''
        run: |
          cp apps/phone/build/outputs/apk/debug/*.apk dist-release/phone-debug.apk
          cp apps/watch/build/outputs/apk/debug/*.apk dist-release/watch-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: paired-apps
          path: |
            apps/phone/build/outputs/apk/debug/*.apk
            apps/watch/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && env.WATCHES_KEYSTORE_B64 != ''
        with:
          name: validated-release
          path: dist-release/*
    outputs:
      publish: ${{ steps.publication.outputs.publish }}

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-release
          path: release
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "watches-build.${{ github.run_number }}" release/* \
            --repo "${{ github.repository }}" \
            --title "Watches build ${{ github.run_number }}" \
            --notes "Validated faces from ${{ github.sha }}"

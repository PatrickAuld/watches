name: Publish phone app to Google Play

on:
  push:
    tags:
      - 'phone-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, for example 0.1.0
        required: true
        default: 0.1.0
        type: string
      track:
        description: Play testing or production track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      rollout_percent:
        description: Production rollout percentage
        required: true
        default: '100'
        type: choice
        options:
          - '10'
          - '25'
          - '50'
          - '100'
      release_notes:
        description: English release notes; defaults to the version name
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: phone-play-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve release version and track
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          DEFAULT_ROLLOUT_PERCENT: ${{ vars.PLAY_PRODUCTION_ROLLOUT || '100' }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ ! "$REF_NAME" =~ ^phone-v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]]; then
              echo "Tag must use phone-vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            version_name="${BASH_REMATCH[1]}"
            track=production
            rollout_percent="$DEFAULT_ROLLOUT_PERCENT"
            release_notes="Release $version_name"
          else
            version_name="$INPUT_VERSION_NAME"
            track="$INPUT_TRACK"
            rollout_percent="$INPUT_ROLLOUT_PERCENT"
            release_notes="$INPUT_RELEASE_NOTES"
            [[ "$track" == "production" ]] || rollout_percent=100
            [[ -n "$release_notes" ]] || release_notes="Release $version_name"
          fi
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$track" =~ ^(internal|alpha|beta|production)$ ]]
          [[ "$rollout_percent" =~ ^(10|25|50|100)$ ]]
          version_code=$((RUN_NUMBER * 100 + RUN_ATTEMPT))
          (( version_code > 0 && version_code <= 2100000000 ))
          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "track=$track"
            echo "rollout_percent=$rollout_percent"
            echo "release_notes<<PLAY_RELEASE_NOTES"
            printf '%s\n' "$release_notes"
            echo "PLAY_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"
      - name: Configure Play upload key
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]
          key="$RUNNER_TEMP/play-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          {
            echo "PLAY_UPLOAD_KEYSTORE=$key"
            echo "PLAY_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PLAY_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "PLAY_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed phone app bundle
        env:
          PLAY_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          PLAY_VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: ./gradlew --no-daemon :apps:phone:bundleRelease -PplayVersionCode="$PLAY_VERSION_CODE" -PplayVersionName="$PLAY_VERSION_NAME"
      - name: Validate Play API configuration
        env:
          PLAY_WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: |
          [[ -n "$PLAY_WIF_PROVIDER" && -n "$PLAY_SERVICE_ACCOUNT" ]] || {
            echo "Set PLAY_WIF_PROVIDER and PLAY_SERVICE_ACCOUNT repository variables before publishing." >&2
            exit 1
          }
      - uses: google-github-actions/auth@v3
        id: google-auth
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - uses: actions/upload-artifact@v4
        with:
          name: phone-play-aab-${{ steps.release.outputs.version_name }}
          path: apps/phone/build/outputs/bundle/release/phone-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Upload and publish release
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          PLAY_TRACK: ${{ steps.release.outputs.track }}
          PLAY_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          PLAY_RELEASE_NOTES: ${{ steps.release.outputs.release_notes }}
          PLAY_ROLLOUT_PERCENT: ${{ steps.release.outputs.rollout_percent }}
        run: >-
          python3 scripts/publish_play.py
          --package-name com.patrickauld.watches.companion
          --bundle apps/phone/build/outputs/bundle/release/phone-release.aab
          --track "$PLAY_TRACK"
          --version-name "$PLAY_VERSION_NAME"
          --release-notes "$PLAY_RELEASE_NOTES"
          --rollout-percent "$PLAY_ROLLOUT_PERCENT"
